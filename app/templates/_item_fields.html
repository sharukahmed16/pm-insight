{# the editable fields of a work item, used by the new-item and the item page #}
<label for="title">Title</label>
<input id="title" name="title" value="{{ values.title or '' }}" maxlength="300" required>
<label for="description">Description</label>
<textarea id="description" name="description">{{ values.description or '' }}</textarea>
<div class="row">
  <div><label for="item_type">Type</label>
    <select id="item_type" name="item_type">
      {% for t in ITEM_TYPES %}<option value="{{ t }}" {% if t == values.item_type %}selected{% endif %}>{{ t }}</option>{% endfor %}
    </select></div>
  <div><label for="assignee_id">Assignee</label>
    <select id="assignee_id" name="assignee_id">
      <option value="">nobody</option>
      {% for u in users %}<option value="{{ u.id }}" {% if u.id == values.assignee_id %}selected{% endif %}>{{ u.full_name }}</option>{% endfor %}
    </select></div>
  <div><label for="sprint_id">Sprint</label>
    <select id="sprint_id" name="sprint_id">
      <option value="">backlog</option>
      {% for s in sprints %}<option value="{{ s.id }}" {% if s.id == values.sprint_id %}selected{% endif %}>{{ s.name }} ({{ s.status }})</option>{% endfor %}
    </select></div>
  <div><label for="story_points">Story points</label>
    <select id="story_points" name="story_points">
      <option value="">not estimated</option>
      {% for p in scale %}<option value="{{ p }}" {% if p == values.story_points %}selected{% endif %}>{{ p }}</option>{% endfor %}
    </select></div>
</div>
