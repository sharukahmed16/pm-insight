{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="narrow">
  <h1>Register</h1>
  <p class="muted small">The first account becomes the manager.</p>
  <form method="post" action="/register">
    <label for="full_name">Full name</label>
    <input id="full_name" name="full_name" value="{{ values.full_name or '' }}" required>
    <label for="username">Username</label>
    <input id="username" name="username" value="{{ values.username or '' }}" autocomplete="username" required>
    <label for="password">Password (at least 8 characters)</label>
    <input id="password" name="password" type="password" autocomplete="new-password" required>
    <label for="password2">Repeat password</label>
    <input id="password2" name="password2" type="password" autocomplete="new-password" required>
    <button type="submit">Create account</button>
  </form>
  <p class="muted">Have an account? <a href="/login">Log in</a>.</p>
</div>
{% endblock %}
